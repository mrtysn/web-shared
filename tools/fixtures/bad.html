<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Every mistake</title>
<style>
  body { font: 16px/1.5 sans-serif; background: #fff; color: #222; margin: 1rem; }
  h1 { font-size: 20px; } h2 { font-size: 32px; }
  .grow { border: none; padding: 4px; }
  .grow:hover, .grow:focus { border: 3px solid #06c; }
  .wide { width: 900px; height: 10px; background: #eee; }
  .cut { width: 60px; overflow: hidden; white-space: nowrap; }
  .tiny { width: 14px; height: 14px; padding: 0; font-size: 8px; }
  .faint { color: #bbb; }
  input.short { width: 80px; }
</style></head><body>
<h1>Title</h1><h2>Section</h2>
<p><button class=grow>Hover me</button></p><p>Below the button</p>
<div class=wide></div>
<div class=cut>This sentence will not fit in sixty pixels</div>
<button class=tiny>x</button>
<p class=faint>Pale grey text on white</p>
<input class=short placeholder="A placeholder far too long for the field">
</body></html>
